[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alerte-mondiale-api"
version = "1.1.0"
description = "Backend professionnel multi-providers de météo hyper-locale (GPS/Marine) et d'alertes catastrophes naturelles mondiales (OpenAPI 3.1, GeoJSON RFC 7946, OASIS CAP 1.2, ESP32-P4 <12Ko)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
