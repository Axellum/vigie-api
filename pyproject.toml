[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie-api"
version = "1.1.0"
description = "Aggregates world natural hazards and weather for the Vigie displays: FastAPI backend, GeoJSON, OASIS CAP 1.2 and a compact ESP32 frame. Unknown values are never made up."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Axel Duviella" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "shapely>=2.0.0",
    # The Sun and the Moon of the aurora estimate (ADR 0013); MIT.
    "astronomy-engine>=2.1.19",
    # The tide (app/services/tides.py) is computed with numpy; shapely brings it too.
    "numpy>=1.26",
]

[project.optional-dependencies]
# The unofficial pre-alert pilot (app/prealert, ADR 0011): decoding the GRIB2 files of the ECMWF (and GFS) models. Not needed by the API itself.
prealert = [
    "numpy>=1.26",
    "eccodes>=2.50",
    # The wheel of eccodes bundles the library on Windows only; elsewhere the library is the eccodeslib wheel.
    "eccodeslib>=2.50; sys_platform != 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

# The reference data: the shapes the warnings are localized with (tools/build_geometries.py), the named active faults
# (tools/build_faults.py; CC BY-SA 4.0, its notice goes with it), the tide model's constants (tools/build_tides.py; CC BY 4.0).
[tool.setuptools.package-data]
app = ["data/*.geojson.gz", "data/*.json.gz", "data/*.json", "data/*.md", "data/*.npz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# Long lines are tolerated: API field descriptions, the dashboard HTML and the watchlist seed.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI declares query parameters as default values: Query(...) is the documented idiom.
"app/main.py" = ["B008"]
