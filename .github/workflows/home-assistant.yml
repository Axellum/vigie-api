name: Home Assistant integration

# custom_components/vigie, checked the way Home Assistant and HACS check an integration: its tests, hassfest, and the
# HACS validation. It has its own workflow because a recent Home Assistant needs a newer Python (3.14.2 or more) than
# the API's jobs run (3.12 and 3.13, ci.yml), and so the API's jobs are not touched by it.
#
# hassfest and the HACS action run a floating Docker image on purpose (their rules follow Home Assistant's), so a
# weekly run tells when a rule changed while nothing here did.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests_ha/**"
      - "hacs.json"
      - "tools/fake_instance.py"
      - "tools/card_in_home_assistant.py"
      - ".github/workflows/home-assistant.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests_ha/**"
      - "hacs.json"
      - "tools/fake_instance.py"
      - "tools/card_in_home_assistant.py"
      - ".github/workflows/home-assistant.yml"
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Home Assistant, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests_ha/requirements.txt

      - name: Install Home Assistant and its test plugin (pinned together)
        run: pip install -r tests_ha/requirements.txt

      - name: Tests (pytest, no network)
        run: python -m pytest tests_ha -q

  card:
    name: Card in a real Home Assistant
    # The dashboard card in Home Assistant's own frontend: its official container, the integration mounted, the fake
    # instance replaying the answers recorded for Biarritz. Captures of every page at two widths and in both themes are
    # kept as an artifact, to be looked at: a green run says the card loads and shows its pages, not that it looks right.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Playwright and its Chromium (pinned)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: The fake instance, replaying the recorded answers (tools/fake_instance.py --replay)
        run: nohup python tools/fake_instance.py --host 127.0.0.1 --port 8099 --replay tests_ha/fixtures > fake_instance.log 2>&1 &

      # The stable release read on 2026-11-22 (same digest as `stable` that day); bump it by hand.
      - name: Home Assistant in its official container, the integration mounted
        run: |
          mkdir -p ha_config/custom_components
          cp -r custom_components/vigie ha_config/custom_components/
          printf 'default_config:\n' > ha_config/configuration.yaml
          docker run -d --name ha --network host -e TZ=Europe/Paris -v "$PWD/ha_config:/config" ghcr.io/home-assistant/home-assistant:2026.11.2

      - name: The card, every page, both widths, both themes
        run: python tools/card_in_home_assistant.py --ha http://127.0.0.1:8123 --instance http://127.0.0.1:8099 --out captures

      - name: What Home Assistant and the fake instance said
        if: always()
        run: |
          docker logs ha 2>&1 | grep -i -E "vigie|custom_components|error" | tail -n 80 || true
          tail -n 40 fake_instance.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: card-captures
          path: captures/
          retention-days: 14

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the commit of `master` read on 2026-10-20 (the action has no version tag that moves); it runs
      # Home Assistant's own image, which is the part that follows Home Assistant.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

  hacs:
    name: HACS validation
    # The action refuses a private repository ("can only validate public repositories", seen on the first run of this
    # workflow): the job is skipped while the repository is private, and runs as soon as it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the commit of `main` read on 2026-10-20 (its last tag is 22.5.0, from 2022).
      # `brands` cannot pass yet: no brand image is published. The repository has topics since 2026-10-21: they are checked.
      # `comment: false` keeps the job read-only (the default comments on the pull request).
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands
          comment: "false"
