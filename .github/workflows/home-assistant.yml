name: Home Assistant integration

# custom_components/vigie, checked the way Home Assistant and HACS check an integration: its tests, hassfest, and the
# HACS validation. It has its own workflow because a recent Home Assistant needs a newer Python (3.14.2 or more) than
# the API's jobs run (3.12 and 3.13, ci.yml), and so the API's jobs are not touched by it.
#
# hassfest and the HACS action run a floating Docker image on purpose (their rules follow Home Assistant's), so a
# weekly run tells when a rule changed while nothing here did.

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "tests_ha/**"
      - "hacs.json"
      - ".github/workflows/home-assistant.yml"
  pull_request:
    paths:
      - "custom_components/**"
      - "tests_ha/**"
      - "hacs.json"
      - ".github/workflows/home-assistant.yml"
  schedule:
    - cron: "41 5 * * 3" # Wednesdays, 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Home Assistant, Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests_ha/requirements.txt

      - name: Install Home Assistant and its test plugin (pinned together)
        run: pip install -r tests_ha/requirements.txt

      - name: Tests (pytest, no network)
        run: python -m pytest tests_ha -q

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the commit of `master` read on 2026-10-20 (the action has no version tag that moves); it runs
      # Home Assistant's own image, which is the part that follows Home Assistant.
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

  hacs:
    name: HACS validation
    # The action refuses a private repository ("can only validate public repositories", seen on the first run of this
    # workflow): the job is skipped while the repository is private, and runs as soon as it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the commit of `main` read on 2026-10-20 (its last tag is 22.5.0, from 2022).
      # `topics` and `brands` cannot pass yet: the repository has no topics, and no brand image is published.
      # `comment: false` keeps the job read-only (the default comments on the pull request).
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          ignore: brands topics
          comment: "false"
