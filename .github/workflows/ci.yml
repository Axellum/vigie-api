name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # A pull request adds a file to changelog.d/ or sources.d/ and leaves CHANGELOG.md alone (a release or assemble branch edits it).
      - name: Fragments apply, and CHANGELOG.md is not edited by hand
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$EVENT:$HEAD_REF" in
            pull_request:release/* | pull_request:assemble/*) python scripts/fragments.py --check ;;
            pull_request:*) python scripts/fragments.py --check --base "origin/$BASE_REF" ;;
            *) python scripts/fragments.py --check ;;
          esac

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Tests (pytest, no network)
        run: python -m pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag vigie-api:ci .

      - name: Run it and ask it (/v1/health, /v1/embedded/frame)
        env:
          VIGIE_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/docker_smoke.sh vigie-api:ci
