name: Card demo

# The online demo of the Home Assistant card, on GitHub Pages: the page of demo/, the recorded answers of demo/data/ and the card
# of the integration as it is on main (tools/build_card_demo.py). A pull request that touches them builds the site; main publishes it.
# The `fit` job checks on the same site that the home page of the card fits it from 300 to 720 px wide, and its Sea page from 340
# (tools/card_demo_fit.py); it does not hold the publication back.

on:
  push:
    branches: [main]
    paths:
      - demo/**
      - custom_components/vigie/frontend/vigie-card.js
      - custom_components/vigie/brand/icon.png
      - tools/build_card_demo.py
      - tools/card_demo_fit.py
      - tools/card_in_home_assistant.py
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - demo/**
      - custom_components/vigie/frontend/vigie-card.js
      - custom_components/vigie/brand/icon.png
      - tools/build_card_demo.py
      - tools/card_demo_fit.py
      - tools/card_in_home_assistant.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the card demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Put the site together
        run: python tools/build_card_demo.py _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  fit:
    name: The home and Sea pages fit the card (demo, 300 to 720 px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Playwright and its Chromium (pinned, as in the Home Assistant workflow)
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      # Home Assistant draws its cards in Roboto, which its frontend serves; the demo serves the same files (demo/fonts/roboto/)
      # and, as Home Assistant, takes a Roboto installed on the machine first. Without any Roboto, Chromium on Linux falls back to
      # DejaVu Sans, a wider font Home Assistant never shows (31 texts cut on 2026-11-27). The job installs Ubuntu's Roboto: with
      # the served files alone, drawn by Linux a little wider, "13:00", the last hour of the activities of the Sea page, went
      # past the edge of a 340 px card in English (2026-11-27): a fault of the card, to be fixed on its own.
      - name: Roboto, the font of Home Assistant
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fonts-roboto
          fc-list | grep -i "Roboto-Regular"

      - name: The home page at nine widths, at the three places of the demo, and the Sea page of its beaches, in French and in English
        run: |
          python tools/build_card_demo.py _site
          python tools/card_demo_fit.py _site --out fit-captures --need-roboto

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: card-fit-captures
          path: fit-captures
          if-no-files-found: ignore

  deploy:
    name: Publish the card demo
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
